<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{:: body}, 'error')}">

<body>
	<img src="../static/resources/images/pets.png" th:src="@{/resources/images/pets.png}">
	
	<h2 th:text="#{somethingHappened}">Something happened...</h2>
	<!--
		◯HTTPステータスコードごとの条件分岐
		・${status}：手動で渡さなくてもSpringBootがエラー情報を自動的に収集して Model へセットする
		 　- status ：HTTPステータスコード（404, 500 など）
		 　- error：ステータスコードの理由（Internal Server Error, Not Foundなど）
		 　- timestamp：エラー発生日時
		 　etc
		・
	-->
	<p th:switch="${status}">
		<span th:case="404" th:text="#{error.404}"></span>
		<span th:case="500" th:text="#{error.500}"></span>
		<span th:case="*" th:text="#{error.general}"></span>
	</p>
	
	<p th:text="${message}">Exception message</p>
</body>
</html>
