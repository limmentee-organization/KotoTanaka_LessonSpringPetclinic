<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
	
<body>
	<form>
		
		<!--
			◯selectエリアの部品作成
			・th:blockタグで部品の定義をすることで差し替え時にタグが残らない
			・外側の<body>や<form>タグはなくても動作する
		-->
		<th:block th:fragment = "select(label, name, items)">
			<!--
				◯バリデーションエラーの有無チェック
				・エラーがあればclass=has-errorを追加
				・エラーがなければclass=form-groupのみ
				・th:with = "valid"：変数validを定義（エラーがなければtrue）
			-->
			<div th:with="valid=${!#fields.hasErrors(name)}" th:class="${'form-group' + (valid ? '' : 'has-error')}" class="form-group">
				<label th:for="${name}" class="col-sm-2 control-label" th:text="${label}">Label</label>
				<div class="col-sm-10">
					<select th:field="*{__${name}__}">
						<option th:each="item : ${items}" th:value="${item}" th:text="${item}">dog</option>
					</select>
					<span th:if="${valid}" class="fa fa-ok form-control-feedback" aria-hidden="true"></span>　<!--fa-okというアイコンが表示されない-->
					<th:block th:if="${!valid}">
						<span class="fa fa-remove form-control-feedback" aria-hidden="true"></span>
						<span class="help-inline" th:errors="*{__${name}__}" th:text="#{error}">Error</span>
					</th:block>
				</div>
			</div>
		</th:block>
		
	</form>
</body>
</html>
