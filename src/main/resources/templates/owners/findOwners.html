<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{:: body}, 'owners')}">

<body>

	<h2 th:text="#{findOwners}">Find Owners</h2>
	
	<!--
		◯オーナー検索Formの作成
		th:object="${owner}"：フォームの中身をJavaのownerと紐づけ
		th:action="@{/owners}"：ボタンを押下した時のデータの送り先（URL）
		method="get"：データの送り方の種類（モード）の指定。get＝URLの末尾に文字をのせて送る検索用の送信モード
		class="form-horizontal"：文字と入力欄を横並びにするBootstrapのデザイン設定
	-->
	<form th:action="@{/owners}" method="get" class="form-horizontal" id="search-owner-form">
		<div class="form-group">
			<div class="control-group" id="lastNameGroup">
				<label class="col-sm-2 control-label" th:text="#{lastName}">Last name</label>
				<div class="col-sm-10">
					<input size="30" maxlength="80">
				</div>
			</div>
		</div>
		
		<div class="form-group">
			<div class="col-sm-offset-2 col-sm-10">
				<button type="submit" class="btn btn-primary" th:text="#{findOwner}">Find Owner</button>
			</div>
		</div>
		
		<a class="btn btn-primary" th:href="@{/owners/new}" th:text="#{addOwner}">Add Owner</a>
	
	</form>
	
</body>
</html>
