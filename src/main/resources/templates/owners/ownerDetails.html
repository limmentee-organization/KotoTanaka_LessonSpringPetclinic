<!DOCTYPE html>
<html xmlns="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::body}, 'owners')}">

<body>
	<!--
		◯オーナー情報テーブル
	-->
	<h2 th:text="#{ownerInformation}">Owner Information</h2>
	<!--
		◯成功メッメッセージ及びーメッセージ表示（リダイレクト用）
		th:if="${message}"：Thymeleafの th:if はboolean以外の値も条件として扱える。値があれば表示される
	-->
	<div th:if="${message}" class="alert alert-success" id="success-message">
		<span th:text="${message}"></span>
	</div>
	<div th:if="${error}" class="alert alert-danger" id="error-message">
		<span th:text="${error}"></span>
	</div>
	
	<!--
		◯オーナー詳細情報
		<b>：ボールド表示
	-->
	<table class="table table-striped" th:object="${owner}">
		<tr>
			<th th:text="#{name}">Name</th>
	
			<td><b th:text="*{firstName + ' ' + lastName}"></b></td>
		</tr>
		<tr>
			<th th:text="#{address}">Address</th>
			<td th:text="*{address}"></td>
		</tr>
		<tr>
			<th th:text="#{city}">City</th>
			<td th:text="*{city}"></td>
		</tr>
		<tr>
			<th th:text="#{telephone}">Telephone</th>
			<td th:text="*{telephone}"></td>
		</tr>
	</table>
	<!--◯ボタンエリア-->
	<a th:href="@{__${owner.id}__/edit}" class="btn btn-primary" th:text="#{editOwner}">Edit Owner</a>
	<a th:href="@{__${owner.id}__/pets/new}" class="btn btn-primary" th:text="#{addNewPet}">Add New Pet</a>
	
	<br />
	<br />
	<br />
	
	<!--
		◯ペット＆訪問履歴テーブル
	-->
	<h2 th:text="#{petsAndVisits}">Pets and Visits</h2>
	
	<table class="table table-striped">
		<tr th:each="pet : ${owner.pets}">
			<!--
				◯ペット情報
				<td>：表のセル一つを表す
				valign="top"：vertical-align、縦方向の位置をtopに合わせる（上寄せ）
				<dl>：Description List、項目名と内容をセットで表示するためのタグ
					<dt>：Description Term、項目名
					<dd>：Description Details、内容
				"${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"：フォーマット指定
				yyyy-MM-dd：MM：月、mmは分を表す　※一桁で表す場合はyyyy-M-d
			-->
			<td valign="top">
				<dl class="dl-horizontal">
					<dt th:text="#{name}">Name</dt>
					<dd th:text="${pet.name}"></dd>
					
					<dt th:text="#{birthDate}">Birth Date</dt>
					<dd th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></dd>
					
					<dt th:text="#{type}">Type</dt>
					<dd th:text="${pet.type}"></dd>
				</dl>
			</td>
			<td valign="top">
				<table class="table-condensed">		<!--table-condensed：行の高さを詰めてコンパクする-->
					<thead>
						<tr>
							<th th:text="#{visitDate}">Visit Date</th>
							<th th:text="#{description}">Description</th>
						</tr>
					</thead>
					<tr th:each="visit : ${pet.visits}">
						<td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
						<!--
							"${visit?.description}"：?.：null安全チェック
							visitがnullの場合エラーを出さずnullとして扱う（空のtdになる）
						-->
						<td th:text="${visit?.description}"></td>
					</tr>
					<tr>
						<td><a th:href="@{__${owner.id}__/pets/__${pet.id}__/edit}" th:text="#{editPet}">Edit Pet</a></td>
						<td><a th:href="@{__${owner.id}__/pets/__${pet.id}__/visits/new}" th:text="#{addVisit}">Add Visit</a></td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
	<script>
		// 成功メッセージとエラーメッセージを3秒後に非表示にする機能の定義
		function hideMessages() {
			setTimeout(function () {
				document.getElementById("success-message").style.display = "none";
				document.getElementById("error-message").style.display = "none";
			}, 3000);
		}
		
		// 関数呼び出し
		hideMessages();
	</script>
</body>
</html>
